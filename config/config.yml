data:
  samples_per_cluster: [500, 500, 500]  # Number of samples per cluster
  # samples_per_cluster: [600, 400, 200]
  num_features: 2
  num_signal_features: 2
  train_ratio: 0.31
  p: 0.65
  q: 0.05
  mu0: 0.0
  mu1: 1.0
  mu2: 1.
  tau: 1.5                        # Maximum norm for k-means centers (||theta|| <= tau)
  gmm_center_min: 4.0              # Minimum radius for GMM cluster centers from origin
  gmm_min_separation: 0.6          # Minimum distance between cluster centers
  gmm_sigma: 0.5                   # Fixed sigma for GMM  
algorithm:
  iters: 250               
  warmup_steps: 500
  momentum_beta: 0.9
  mu_lr_max: 1e-6
  mu_lr_min: 1e-12
  min_mu: 1e-4
  soft_assign_s: 0.25
  # warm_start: "optimal"                  # "optimal" or "random" or "cluster"
  warm_start: "random"                  # "optimal" or "random" or "cluster"
  Abar: True
  normalize: True
  unit_trace: False
  independent_rho: False
optimizer:
  type: "sgd"  # Options: "adam", "sgd"
  learning_rate:
    initial: 0.075 # Initial learning rate
    min: 0.000000001    # Minimum learning rate
    decay_rate: 0.999  # Decay rate for learning rate scheduling
    decay_steps: 10   # Number of steps between learning rate updates
    method: "linear"  # Options: "exponential", "linear", "cosine"
  adam:
    beta1: 0.9     
    beta2: 0.999   
    epsilon: 0.00000001  
  sgd:
    momentum: 0.9
